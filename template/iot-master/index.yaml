apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: iot-master
spec:
  title: 'IoT Master'
  url: 'https://github.com/god-jason/iot-master'
  gitRepo: 'https://github.com/god-jason/iot-master'
  author: 'god-jason'
  description: >-
    IoT Master is an open-source IoT data platform written in Go. Single-binary
    deployment with an embedded web console and MQTT broker, pluggable device
    protocols (Modbus, DL/T645, CJ/T188), product/device management, alarms,
    multi-tenant user management, and optional InfluxDB history storage.
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/iot-master/logo.ico'
  templateType: inline
  locale: en
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/iot-master/README.md'
  i18n:
    zh:
      description: >-
        物联大师是开源免费的物联网数据中台，采用 Go 语言实现的单一程序，内置 Web 控制台与
        MQTT 总线，支持 Modbus、DL/T645 等协议插件、产品与设备管理、报警、组织与用户管理，
        历史数据可对接 InfluxDB。本模板使用 KubeBlocks MySQL 存储业务数据。
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/iot-master/README_zh.md'
  categories:
    - backend
    - tool
  defaults:
    app_name:
      type: string
      value: 'iot-master-${{ random(8) }}'
    app_host:
      type: string
      value: 'iot-master-${{ random(8) }}'
    jwt_key:
      type: string
      value: '${{ random(16) }}'
    broker_key:
      type: string
      value: '${{ random(16) }}'

---
# MySQL 连接账号 RBAC（KubeBlocks 托管数据库）
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: ac-mysql-8.0.30-1
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
  name: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      noCreatePDB: false
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []

---
# 幂等创建应用数据库 iot_master（应用只编译了 MySQL 驱动，库必须预先存在）
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql-init
          image: mysql:8.0.30
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" --silent 2>/dev/null; then
                  break
                fi
                sleep 2
              done
              mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" --silent
              mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -e "CREATE DATABASE IF NOT EXISTS iot_master CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"
              echo "database iot_master ready"

---
# 引导脚本（仅 initContainer 使用，渲染首次启动配置；播种动作在 initContainer 命令中执行）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-bootstrapvn-initvn-sh: |
    #!/bin/sh
    set -eu

    i=0
    while [ "$i" -lt 90 ]; do
      if nc -z "$DB_HOST" "$DB_PORT" 2>/dev/null; then
        break
      fi
      i=$((i+1))
      sleep 2
    done
    if ! nc -z "$DB_HOST" "$DB_PORT" 2>/dev/null; then
      echo "mysql ${DB_HOST}:${DB_PORT} not reachable" >&2
      exit 1
    fi

    if [ ! -f /app-data/iot-master.yaml ]; then
      cat > /app-data/iot-master.yaml <<EOF
    broker:
        enable: true
        anonymous: false
        key: "${BROKER_KEY}"
        loglevel: ERROR
        port: 1883
    database:
        type: mysql
        url: "${DB_USERNAME}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/iot_master?charset=utf8"
        sync: true
    log:
        level: info
        output: stdout
    mqtt:
        url: mqtt://localhost:1883
    table:
        path: tables
        sync: true
    web:
        mode: http
        port: 8080
        jwt_key: "${JWT_KEY}"
    EOF
    fi
    echo "bootstrap done"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: 'ghcr.io/tangzong2021/iot-master:v1.0.8'
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: ghcr.io/tangzong2021/iot-master:v1.0.8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: BROKER_KEY
              value: '${{ defaults.broker_key }}'
            - name: JWT_KEY
              value: '${{ defaults.jwt_key }}'
          command:
            - /bin/sh
            - -c
            - |
              cp -rn /opt/iot-master/pages /opt/iot-master/protocols /opt/iot-master/tables /opt/iot-master/menu.json /app-data/ || true
              exec /bin/sh /bootstrap/init.sh
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /bootstrap/init.sh
              subPath: vn-bootstrapvn-initvn-sh
            - name: vn-appvn-data
              mountPath: /app-data
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/tangzong2021/iot-master:v1.0.8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - name: http
              containerPort: 8080
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: vn-appvn-data
              mountPath: /app-data
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-data
        annotations:
          path: /app-data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: 'https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}'
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/iot-master/logo.ico'
  name: '物联大师'
  type: link
