name: Sealos Build

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - sealos-build
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:v1.0.3
          build-args: |
            VERSION=1.0.0
            GIT_HASH=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
